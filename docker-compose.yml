name: devenv

services:
  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    ports:
      - "1025:1025" # SMTP port (mapped to host if needed)
      - "8025:8025" # Web UI port
    networks:
      - mail
    restart: "no"

  meilisearch:
    image: getmeili/meilisearch:latest
    container_name: meilisearch
    ports:
      - "7700:7700"
    environment:
      - MEILI_ENV=development
      - MEILI_NO_ANALYTICS=true
    volumes:
      - meili_data:/meili_data
    restart: unless-stopped
    networks:
      - database
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s     # How often to perform the check
      timeout: 5s      # Fail if response takes longer than 5s
      retries: 5        # Mark as unhealthy after 5 failed checks
      start_period: 10s # Grace period during initial engine launch

  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000" # API port
      - "9001:9001" # Web Console port
    environment:
      MINIO_ROOT_USER: root
      MINIO_ROOT_PASSWORD: minioroot
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: "no"
    networks:
      - storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mongodb:
    image: mongo:8
    container_name: mongodb-8
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - database
    restart: "no"
#    healthcheck:
#      test: ["CMD-SHELL", "mongosh --eval 'db.ping()' || exit 1"]
#      interval: 10s
#      timeout: 5s
#      retries: 5
#      start_period: 15s

  mysql:
    image: mysql:8.0
    container_name: mysql-8
    restart: "no"
    environment:
      # This flag allows you to connect as 'root' with a blank password
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres:
    image: postgres:18-alpine
    container_name: postgres-18
    restart: "no"
    environment:
      - POSTGRES_USER=root
      - POSTGRES_DB=postgres
      - POSTGRES_HOST_AUTH_METHOD=trust
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - database
    healthcheck:
      test: ["CMD", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5

  typesense:
    image: typesense/typesense:30.2  # Or check Docker Hub for the latest stable version
    container_name: typesense
    ports:
      - "8108:8108"
    environment:
      - TYPESENSE_DATA_DIR=/data
      - TYPESENSE_ENABLE_CORS=true
      - TYPESENSE_API_KEY=root
    volumes:
      - typesense_data:/data
    restart: "no"
    networks:
      - database
#    healthcheck:
#      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8108/health || exit 1"]
#      interval: 10s     # How often to check
#      timeout: 5s      # Fail if response takes longer than 5s
#      retries: 5        # Mark as unhealthy after 5 failed attempts
#      start_period: 10s # Grace period during initial data load

  valkey:
    image: valkey/valkey:8.0-alpine
    container_name: valkey
    restart: "no"
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    # We run the server and pass configuration flags inline 
    # This enables data persistence (AOF) and sets the access password
    command: valkey-server --appendonly yes --protected-mode no
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - database

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: "no"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/www/html:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    networks:
      - web
      - mail
      - storage
#    healthcheck:
#      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost/ || exit 1"]
#      interval: 10s     # How often to run the check
#      timeout: 3s       # Fail if check takes longer than 3s
#      retries: 3        # Mark as unhealthy after 3 consecutive failures
#      start_period: 5s  # Grace period during container boot

  php85:
    build:
      context: .
      dockerfile: ./php85/Dockerfile
    container_name: php85
    volumes:
      - /var/www/html:/var/www/html
    restart: "no"
    networks:
      - web
      - database
      - storage
      - mail
#    healthcheck:
#      test: ["CMD-SHELL", "php-fpm-healthcheck || exit 1"]
#      interval: 10s
#      timeout: 5s
#      retries: 3

  php84:
    build:
      context: .
      dockerfile: ./php84/Dockerfile
    container_name: php84
    volumes:
      - /var/www/html:/var/www/html
    restart: "no"
    networks:
      - web
      - database
      - storage
      - mail
#    healthcheck:
#      test: ["CMD-SHELL", "php-fpm-healthcheck || exit 1"]
#      interval: 10s
#      timeout: 5s
#      retries: 3


networks:
  web:
  mail:
  database:
  storage:

volumes:
  meili_data:
  minio_data:
  mongo_data:
  mysql_data:
  pgdata:
  typesense_data:
  valkey_data:
