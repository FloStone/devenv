server {
    listen 80;
    server_name ~^(?<subdomain>.+)\.test$;

    # This dynamically sets the root path based on the subdomain
    root /var/www/html/$subdomain/public;
    index index.php index.html;

    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf)$ {
        expires max;
        log_not_found off;
        access_log off;
        try_files $uri =404;
    }

    # Pass PHP scripts to PHP-FPM
    location ~ \.php$ {
        fastcgi_pass php84:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Deny access to hidden files (like .env or .git)
    location ~ /\. {
        deny all;
    }
}

server {
    listen 443 ssl;
    server_name mailpit.local;

    ssl_certificate /etc/nginx/ssl/mailpit.local.pem;
    ssl_certificate_key /etc/nginx/ssl/mailpit.local-key.pem;

    location / {
        proxy_pass http://mailpit:8025;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSockets are required for Mailpit's live inbox UI updates
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
    }
}

server {
